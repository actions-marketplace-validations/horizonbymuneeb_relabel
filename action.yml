name: "relabel verify"
description: "White-label verification gate: brand strings, console errors and overflow, with a JSON proof artifact."
author: "horizonbymuneeb"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  url:
    description: "URL of the running app to verify (for example https://status.example.com)."
    required: true
  brand:
    description: "Path to the brand.yaml spec (relative to the repository root)."
    required: false
    default: "brand.yaml"
  version:
    description: "Pinned relabeld npm version to run (default: 1.1.0). Bump deliberately; do not track latest in a release gate."
    required: false
    default: "1.1.0"
  shots:
    description: "Directory for the verification screenshots (uploaded with the proof)."
    required: false
    default: ".relabel/verify"
  cdp:
    description: "Optional Chrome DevTools Protocol endpoint to reuse instead of launching Chromium."
    required: false
  report:
    description: "Optional output path for the self-contained HTML report (uploaded as an artifact)."
    required: false
  fail-on:
    description: "Comma-separated check groups that fail the gate: brand, console, overflow, screenshot(s), favicon."
    required: false
    default: "brand,console,overflow"

outputs:
  report:
    description: "Path of the uploaded HTML report (empty when not requested)."
    value: ${{ inputs.report }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    # `verify --json` is the gate. The JSON proof is also persisted so the
    # optional HTML report and the fail-on policy can consume it.
    - name: Verify brand
      id: verify
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_BRAND: ${{ inputs.brand }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CDP: ${{ inputs.cdp }}
        INPUT_SHOTS: ${{ inputs.shots }}
      run: |
        set -uo pipefail

        json_path="${RUNNER_TEMP:-/tmp}/relabel-verify.json"
        echo "json_path=$json_path" >> "$GITHUB_OUTPUT"

        args=(verify --url "$INPUT_URL" --brand "$INPUT_BRAND" --json --out "$json_path" --shots "$INPUT_SHOTS")
        if [ -n "${INPUT_CDP:-}" ]; then
          args+=(--cdp "$INPUT_CDP")
        fi

        set +e
        npx -y "relabeld@${INPUT_VERSION}" "${args[@]}"
        code=$?
        set -e

        if [ ! -s "$json_path" ]; then
          echo "::error::relabel verify produced no JSON proof (exit $code)"
          exit 1
        fi
        if [ "$code" -ne 0 ]; then
          echo "::group::relabel verify JSON"
          cat "$json_path"
          echo "::endgroup::"
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"

    # fail-on maps check ids by group prefix: brand -> brand-title/brand-strings,
    # console -> console-errors, overflow -> overflow, etc.
    - name: Apply fail-on policy
      shell: bash
      env:
        VERIFY_JSON: ${{ steps.verify.outputs.json_path }}
        VERIFY_CODE: ${{ steps.verify.outputs.code }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail

        node - "$VERIFY_JSON" "$INPUT_FAIL_ON" "$VERIFY_CODE" <<'NODE'
        const fs = require("node:fs");
        // argv[0] = node, argv[1] = "-" (stdin script); real args start at 2.
        const [file, failOn, verifyCode] = process.argv.slice(2);
        let result;
        try {
          result = JSON.parse(fs.readFileSync(file, "utf8"));
        } catch (err) {
          console.error(`::error::cannot parse verify JSON: ${err.message}`);
          process.exit(2);
        }
        const checks = Array.isArray(result.checks) ? result.checks : [];
        const failed = checks.filter((c) => c.status === "fail").map((c) => c.id);
        // Normalize singular/plural so "screenshot" and "screenshots" both work,
        // and match check ids by exact name, prefix (brand -> brand-title) or head.
        const normalize = (value) => value.toLowerCase().replace(/s$/, "");
        const groups = String(failOn || "")
          .split(",")
          .map((s) => normalize(s.trim()))
          .filter(Boolean);
        const hits = failed.filter((id) => {
          const norm = normalize(id);
          const head = norm.split("-")[0];
          return groups.some((g) => norm === g || norm.startsWith(`${g}-`) || head === g);
        });
        const summary = result.summary || {};
        console.log(
          `relabel verify: passed=${summary.passed ?? "?"} failed=${summary.failed ?? failed.length} skipped=${summary.skipped ?? "?"} (exit ${verifyCode || 0})`,
        );
        if (failed.length > 0) {
          console.log(`failed checks: ${failed.join(", ")}`);
        }
        if (failed.length === 0) {
          console.log("gate: pass");
          process.exit(0);
        }
        if (hits.length === 0) {
          console.log(
            `::warning::failed checks [${failed.join(", ")}] are outside fail-on (${groups.join(", ") || "none"}); gate passes`,
          );
          process.exit(0);
        }
        console.error(`::error::failed checks matched fail-on: ${hits.join(", ")}`);
        process.exit(1);
        NODE

    - name: Job summary
      if: always()
      shell: bash
      env:
        VERIFY_JSON: ${{ steps.verify.outputs.json_path }}
      run: |
        set -uo pipefail
        [ -s "${VERIFY_JSON:-}" ] || exit 0
        node - "$VERIFY_JSON" <<'NODE'
        const fs = require("node:fs");
        const file = process.argv[2];
        let result;
        try {
          result = JSON.parse(fs.readFileSync(file, "utf8"));
        } catch {
          process.exit(0);
        }
        const checks = Array.isArray(result.checks) ? result.checks : [];
        const failed = checks.filter((check) => check.status === "fail");
        const skipped = checks.filter((check) => check.status === "skip");
        const summary = result.summary ?? {};
        const lines = [];
        lines.push(`## relabeld ${failed.length === 0 ? "✅ verified" : "❌ failed"} — ${result.brandName ?? "brand"}`);
        lines.push("");
        lines.push(`- page: ${result.url ?? "?"}`);
        lines.push(`- checks: **${summary.passed ?? checks.length - failed.length - skipped.length} passed**, ${summary.failed ?? failed.length} failed, ${summary.skipped ?? skipped.length} skipped`);
        if (failed.length > 0) {
          lines.push("");
          lines.push("| failed check | detail |");
          lines.push("|---|---|");
          for (const check of failed.slice(0, 20)) {
            const detail = String(check.detail ?? check.message ?? "").replace(/\|/g, "\\|").slice(0, 180);
            lines.push(`| ${check.id ?? "check"} | ${detail} |`);
          }
        }
        const text = lines.join("\n") + "\n";
        console.log(text);
        if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
        NODE

    - name: Build HTML report
      if: always() && inputs.report != ''
      shell: bash
      env:
        INPUT_REPORT: ${{ inputs.report }}
        INPUT_VERSION: ${{ inputs.version }}
        VERIFY_JSON: ${{ steps.verify.outputs.json_path }}
      run: |
        set -euo pipefail
        if [ ! -s "${VERIFY_JSON:-}" ]; then
          echo "::warning::no verify JSON available; skipping report"
          exit 0
        fi
        npx -y "relabeld@${INPUT_VERSION}" report --input "$VERIFY_JSON" --out "$INPUT_REPORT" --json

    - name: Upload proof and screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: relabel-evidence
        path: |
          ${{ inputs.report }}
          ${{ inputs.shots }}
          .relabel/verify.json
        if-no-files-found: warn
        retention-days: 14
